name: Deploy Hotel Messenger

on:
  push:
    branches: ["main"]

jobs:
  deploy_docker_hub:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker login
      uses: docker/login-action@v3.6.0
      with:
        username: ${{ secrets.USERNAME_DOCKER_HUB }}
        password: ${{ secrets.PASSWORD_DOCKER_HUB }}

    - name: Docker Build and Push Image
      uses: docker/build-push-action@v6.18.0
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.USERNAME_DOCKER_HUB }}/hotel_messenger:${{ github.ref_name }}

  deploy_vps:
    runs-on: ubuntu-latest
    needs: deploy_docker_hub
    steps:
    - name: Atualizar container na VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script_stop: true
        script: |
          cd ${{ secrets.VPS_PROJECT_PATH }}
          docker compose pull hotel_messenger
          docker compose up -d hotel_messenger
          docker image prune -f